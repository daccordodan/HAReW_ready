# Configuration for the BASELINE SHARP reproduction.
# Extension tasks use their own separate config files.

project:
  name: "wifi-har-sharp-baseline"
  description: "Baseline SHARP reproduction (PyTorch), 5-class task: E, W, R, J, L"

paths:
  doppler_traces_dir: "data/doppler_traces"
  output_dir: "outputs/baseline"
  output_dir_indep: "outputs/independent"

hardware:
  n_antennas: 4                # Physical monitor antennas in the recordings
  num_workers: 2
  pin_memory: true
  persistent_workers: true

local_hardware:                # Local GPU parameters
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  torch_num_threads: 8
  torch_num_interop_threads: 2

doppler:
  stacked_vectors_nw: 340       # Nw -- window length fed to the classifier
  velocity_bins_nd: 100         # ND -- (shape[1]==100)
  window_stride: 30

model:
  n_classes_primary: 5          # E, W, R, J, L -- see src/data/label_mapping.py
  dropout_rate: 0.2
  reference_param_count: 128535

training:
  batch_size: 16                  # per-window batches
  learning_rate: 0.0001
  epochs: 100
  early_stopping_patience: 15     # stop after this many epochs without improving fused validation accuracy
  early_stopping_patience_indep: 8  # stop after this many epochs without improving independent validation accuracy
  train_split: 0.6               # of S1 only
  val_split: 0.2                 # of S1 only

evaluation:
  test_sets: ["S1", "S2", "S3", "S4", "S5", "S6", "S7"]
  s7_reference_accuracy: 0.9599
